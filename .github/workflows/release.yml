name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Import the Authenticode PFX so the Tauri bundler can sign the
      # installer (thumbprint configured in tauri.conf.json > bundle.windows).
      - name: Import code-signing certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass | Out-Null
          Remove-Item $pfxPath -Force

      # The Tauri bundler downloads the NSIS toolset from GitHub Releases with
      # no retry; when the release-download endpoint flaps 504 the whole build
      # fails. Pre-cache it here with aggressive retries instead.
      - name: Pre-cache NSIS toolset
        run: |
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsisDir = Join-Path $tools "NSIS"
          if (Test-Path (Join-Path $nsisDir "Bin\makensis.exe")) {
            Write-Host "NSIS toolset already cached"
            exit 0
          }
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          $expected = "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D"
          $ok = $false
          for ($i = 1; $i -le 15; $i++) {
            curl.exe -fsSL --max-time 300 -o $zip "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash $zip -Algorithm SHA1).Hash -eq $expected) {
              $ok = $true
              break
            }
            Write-Host "NSIS download attempt $i failed, retrying in 8s"
            Start-Sleep -Seconds 8
          }
          if (-not $ok) { throw "Failed to download NSIS toolset after 15 attempts" }
          $extract = Join-Path $env:RUNNER_TEMP "nsis-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Move-Item (Join-Path $extract "nsis-3.11") $nsisDir

          # The nsis_tauri_utils.dll plugin is NOT part of the NSIS zip; the
          # bundler downloads it separately and requires it in the cache.
          $dll = Join-Path $env:RUNNER_TEMP "nsis_tauri_utils.dll"
          $dllExpected = "75197FEE3C6A814FE035788D1C34EAD39349B860"
          $dllOk = $false
          for ($i = 1; $i -le 15; $i++) {
            curl.exe -fsSL --max-time 120 -o $dll "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
            if ($LASTEXITCODE -eq 0 -and (Get-FileHash $dll -Algorithm SHA1).Hash -eq $dllExpected) {
              $dllOk = $true
              break
            }
            Write-Host "nsis_tauri_utils.dll download attempt $i failed, retrying in 8s"
            Start-Sleep -Seconds 8
          }
          if (-not $dllOk) { throw "Failed to download nsis_tauri_utils.dll after 15 attempts" }
          $dllTarget = Join-Path $nsisDir "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $dllTarget | Out-Null
          Move-Item $dll (Join-Path $dllTarget "nsis_tauri_utils.dll") -Force
          Write-Host "NSIS toolset fully pre-cached at $nsisDir"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Droid Vault v__VERSION__"
          releaseBody: "Xem tài sản trong phần tải xuống để cài đặt."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # Publish the public code-signing certificate so end users can trust
      # the installer (import into Trusted Root + Trusted Publishers).
      - name: Upload code-signing certificate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release upload "v$version" "certs/droid-vault-codesign.cer" --clobber
